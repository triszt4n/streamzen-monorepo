name: Test2

on:
  workflow_dispatch:

jobs:
  build_matrix:
    name: Build matrix
    uses: ./.github/workflows/_test.yml

  matrix_job:
    name: Use matrix
    runs-on: ubuntu-latest
    needs: build_matrix
    strategy:
      fail-fast: false # Continue with other directories if one fails
      matrix:
        item: ${{ fromJson(needs.build_matrix.outputs.matrix) }}
    steps:
      - name: Echo
        run: |
          echo ${{ matrix.item.path }}
